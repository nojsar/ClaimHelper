<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GetMyYes">
  <title>GetMyYes</title>
  <!-- Full-bleed on purpose. A browser tab gets 16 real pixels, so the paper
       margin and the inset rounded square the app icons use were spending a
       quarter of them on padding and reading as a checkbox rather than a mark. -->
  <rect width="64" height="64" rx="13" fill="#2F6F62"/>
  <path d="M15 33.5 L26.5 45 L49 20"
        fill="none" stroke="#FFFFFF" stroke-width="8.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
