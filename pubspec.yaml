name: claimhelper
description: "ClaimHelper — turn a health-insurance denial letter into a ready-to-review appeal packet."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  cloud_functions: ^6.0.0

  # File handling
  file_picker: ^10.0.0
  image_picker: ^1.1.2

  # PDF export
  pdf: ^3.11.1
  printing: ^5.13.2

  # Misc
  intl: ^0.20.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8

  # Design system
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
