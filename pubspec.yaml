name: claimhelper
description: "GetMyYes — turn a health-insurance denial letter into a ready-to-review appeal packet."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  cloud_functions: ^6.0.0

  # File handling
  file_picker: ^10.0.0
  image_picker: ^1.1.2
  web: ^1.1.0

  # PDF export
  pdf: ^3.11.1
  printing: ^5.13.2

  # Misc
  intl: ^0.20.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Fonts are bundled (not fetched from Google Fonts at runtime) so the app
  # makes no third-party requests for assets — a GDPR requirement.
  assets:
    - assets/fonts/

  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Italic.ttf
          style: italic
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces72pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces72pt-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    # CanvasKit checks for a family named Roboto before downloading its own
    # fallback from Google. Point that fallback at our bundled Noto Sans files
    # so every font remains same-origin and covered by the privacy policy.
    - family: Roboto
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Italic.ttf
          style: italic
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic
