name: Clean up old autopilot posts

# Run by hand only. Lists (or, with delete ticked, permanently removes) the
# autopilot's own posts published before the cutoff, on every network whose
# secrets exist. See tool/cleanup_posts.mjs. Always run it once with delete
# unticked and read the list first.
on:
  workflow_dispatch:
    inputs:
      delete:
        description: "Delete the listed posts (permanent). Leave unticked to only list them."
        required: false
        default: false
        type: boolean
      before:
        description: "Only posts published before this UTC time"
        required: false
        default: "2026-10-14T00:00:00Z"
        type: string

permissions:
  contents: read

concurrency:
  group: getmyyes-marketing-autopilot
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: List or delete old autopilot posts
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_SERVER: ${{ secrets.MASTODON_SERVER }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLEANUP_BEFORE: ${{ inputs.before }}
        run: node tool/cleanup_posts.mjs ${{ inputs.delete && '--delete' || '' }}
