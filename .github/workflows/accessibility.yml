name: Accessibility checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wcag-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter packages
        run: flutter pub get
      - name: Analyze Flutter source
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build and test analytics functions
        run: |
          npm ci --prefix functions
          npm --prefix functions audit --omit=dev --audit-level=high
          npm --prefix functions run build
          npm --prefix functions test
          node tool/rules_test.mjs
          node tool/analytics_tracker_test.mjs
      - name: Validate source accessibility
        run: |
          node tool/marketing_build.mjs
          node tool/accessibility_check.mjs web
          npx --yes html-validate@10.10.0 "web/**/*.html"
      - name: Match ChromeDriver to the runner's Chrome
        # @axe-core/cli pulls the newest chromedriver, which breaks whenever the
        # runner image's preinstalled Chrome lags a major version behind.
        run: |
          chrome_major="$(google-chrome --version | sed -E 's/[^0-9]*([0-9]+).*/\1/')"
          npm install --no-save "chromedriver@^${chrome_major}"
          echo "AXE_CHROMEDRIVER_PATH=$(node -p "require('chromedriver').path")" >> "$GITHUB_ENV"
      - name: Build and validate deploy artifact
        run: |
          flutter build web
          node tool/marketing_build.mjs --stage-build
          node tool/marketing_build.mjs --verify-build
          node tool/accessibility_check.mjs build/web
          node tool/rendered_accessibility_check.mjs build/web
