name: Marketing autopilot

on:
  schedule:
    # Useful evergreen guide 3x/week (Mon, Wed, Fri). UTC avoids DST drift.
    # Frequency is deliberately paced to the guide library size — raise it as
    # the weekly generator grows the rotation pool, not ahead of it.
    - cron: "17 15 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview a post without publishing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: getmyyes-marketing-autopilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Instagram transcodes the reel before it can publish
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate the guide library
        run: node tool/marketing_build.mjs
      - name: Check static accessibility regressions
        run: node tool/accessibility_check.mjs web
      - name: Check every queue post has its rendered media
        # Loud, but never fatal. This sat before the publish step as a hard
        # gate, so a single unrendered guide silenced all seven networks —
        # exactly what the weekly generator produces when it adds a queue
        # entry. The posters already fall back to a still or a link card.
        shell: bash
        run: |
          if ! node tool/social_video.mjs --check; then
            echo "::warning title=Unrendered social media::A queue post has no Remotion render, so its network will fall back to a still or link card. Run node tool/render_social_video.mjs and commit the output."
          fi
      - name: Publish the day's guide to every configured network
        env:
          # Each network activates the moment its secrets exist; missing ones
          # are skipped with a log line (see tool/post_all.mjs).
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_SERVER: ${{ secrets.MASTODON_SERVER }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node tool/post_all.mjs --dry-run
          else
            node tool/post_all.mjs
          fi
